name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 跑测试
        # 不装任何第三方包 —— 这个项目零依赖，CI 里也不该出现 pip install
        run: python -m unittest discover -s tests -t . -v

      - name: 冒烟测试
        # 测试全绿不代表命令能用，所以再真的跑一次
        run: python -m filetidy dirs . --top 3
